# Essai de la voix libre « Tom » (Piper) — 21/11. Fabrique un extrait audio et mesure le temps de synthèse.
# Ne touche ni à la base ni au site : il produit seulement un fichier téléchargeable (artefact).
name: Essai voix Tom
on:
  push:
    branches: [voix-tom]
    paths: [".github/workflows/voix-tom-essai.yml", "scripts/voix/**"]
permissions:
  contents: write
jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Installer Piper et la voix
        run: |
          pip install -q piper-tts
          mkdir -p voix && cd voix
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/tom/medium
          curl -sSfL -o fr_FR-tom-medium.onnx "$base/fr_FR-tom-medium.onnx"
          curl -sSfL -o fr_FR-tom-medium.onnx.json "$base/fr_FR-tom-medium.onnx.json"
          r=https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR
          for v in upmc/medium/fr_FR-upmc-medium; do
            n=$(basename $v); curl -sSfL -o $n.onnx "$r/$v.onnx"; curl -sSfL -o $n.onnx.json "$r/$v.onnx.json"
          done
          ls -la
      - name: Fabriquer les extraits
        run: python3 scripts/voix/essai_variantes.py sortie
      - name: Déposer les extraits sur la branche d'essai
        run: |
          mkdir -p essais && mv sortie/*.wav essais/
          git config user.name "betwise-essai" && git config user.email "actions@users.noreply.github.com"
          git add essais && git commit -m "Variantes de voix" && git push
