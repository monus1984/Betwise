name: Captures des écrans (audit UI/UX)

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Adresse à capturer"
        default: "https://betwise-iota.vercel.app"

permissions:
  contents: write

jobs:
  captures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npx tsx scripts/audit-ecrans.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BETWISE_URL: ${{ inputs.url || 'https://betwise-iota.vercel.app' }}
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout --orphan audit-ecrans && git rm -rqf --cached . >/dev/null 2>&1 || true
          git add -f rapports/ecrans && git commit -qm "Captures des écrans du $(date -u +%d/%m\ %Hh%M)" && git push -f origin audit-ecrans
