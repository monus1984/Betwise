name: Vérification modifier / supprimer (compte d'audit)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gestion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npx tsx scripts/audit-gestion.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - if: always()
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout --orphan audit-gestion && git rm -rqf --cached . >/dev/null 2>&1 || true
          git add -f rapports/gestion && git commit -qm "Vérification modifier/supprimer du $(date -u +%d/%m\ %Hh%M)" && git push -f origin audit-gestion
