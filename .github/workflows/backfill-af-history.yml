name: Historique xG (API-Football)

on:
  workflow_dispatch:
    inputs:
      saisons:
        description: "Saisons (ex. 2024 2025 2026)"
        default: "2024 2025 2026"
      ligues:
        description: "Identifiants API-Football séparés par des virgules (vide : les 5 grands championnats)"
        default: ""

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/backfill-af-history.ts ${{ inputs.ligues && format('--ligues={0}', inputs.ligues) || '' }} ${{ inputs.saisons }}
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
