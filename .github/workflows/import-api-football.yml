name: Matchs API-Football (Afrique, amicaux)

on:
  schedule:
    # scores et calendrier : toutes les 15 minutes ; cotes de référence : 07:10 UTC
    - cron: "*/15 * * * *"
    - cron: "10 7 * * *"
  workflow_dispatch:
    inputs:
      cotes:
        description: "Importer aussi les cotes"
        type: boolean
        default: true

concurrency:
  group: import-api-football
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/import-api-football.ts ${{ (github.event.schedule == '10 7 * * *' || inputs.cotes) && '--cotes' || '' }}
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
